start_theme:
  target:
  fields:
    room:
      required: true
      example: living_room
      selector:
        text:
    theme:
      required: false
      example: halloween
      selector:
        text:

stop:
  fields:
    room:
      required: false
      example: living_room
      selector:
        text:

set_color:
  target:
  fields:
    room:
      required: false
      example: living_room
      selector:
        text:
    rgb_color:
      required: true
      example: [255, 64, 0]
      selector:
        color_rgb:
    brightness:
      required: false
      example: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
